<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Change Log</title><link rel="stylesheet" href="style.css"></head><body><div class="container">
<nav><a href="index.html">Command Center</a><a href="windows.html">Big Cheesey</a><a href="ubuntu.html">Big Steezy</a><a href="splunk.html">Big Sludge</a><a href="vyos.html">Big Bedrock</a><a href="toolbox.html">Toolbox</a></nav>
<div class="hero"><h1>Change Log</h1><p>Record major changes so you can troubleshoot quickly instead of guessing what broke.</p></div>

<div class="card">
<h2>Add Change</h2>
<div class="form-grid">
<div class="field"><label>Time</label><input id="time"></div>
<div class="field"><label>Host</label><input id="host"></div>
<div class="field"><label>Result</label><select id="result"><option>Successful</option><option>Partial</option><option>Rolled Back</option><option>Needs Follow-up</option></select></div>
</div>
<div class="field"><label>What Changed / Why</label><textarea id="change"></textarea></div>
<div class="field"><label>Rollback / Recovery Notes</label><textarea id="rollback"></textarea></div>
<button class="btn" id="add">Add Change</button>
</div>
<div id="entries"></div>
</div><script src="data.js"></script><script>
const name="changes";
function render(){const a=load(name);entries.innerHTML=a.map((x,i)=>`<div class="entry"><div class="entry-head"><h3>${esc(x.host)}</h3><small>${esc(x.time)} • ${esc(x.result)}</small></div><p><b>Change:</b> ${esc(x.change).replace(/\n/g,"<br>")}</p><p><b>Rollback:</b> ${esc(x.rollback).replace(/\n/g,"<br>")}</p><button class="small-btn danger" onclick="del(${i})">Delete</button></div>`).join("")}
function del(i){const a=load(name);a.splice(i,1);save(name,a);render()}
add.onclick=()=>{const a=load(name);a.push({time:time.value,host:host.value,result:result.value,change:change.value,rollback:rollback.value});save(name,a);render();}
render();
</script></body></html>
